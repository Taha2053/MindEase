<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindEase session review</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#171717;background:#fff}body{max-width:820px;margin:0 auto;padding:32px;line-height:1.6}h1,h2,h3{line-height:1.3;break-after:avoid}h1{font-size:1.8rem;margin-bottom:6px}h2{border-bottom:1px solid #cbd5e1;padding-bottom:6px;margin-top:32px;font-size:1.28rem;color:#0f172a}h3{font-size:1.05rem;margin-top:20px;color:#1e293b}article{break-inside:avoid-page;margin:16px 0}li{margin:6px 0}a{color:#2563eb;overflow-wrap:anywhere}.source-section{border-top:1px solid #e2e8f0;margin-top:24px;padding-top:16px}.source-section p{margin:8px 0}.source-original{font-size:.88rem;color:#475569;margin-top:8px}.toolbar{position:sticky;top:0;background:#fff;padding:12px 0;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:12px;z-index:100}button#print{font:inherit;padding:8px 16px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-weight:600;cursor:pointer}.session-time-sub{color:#64748b;font-size:.92rem;margin-top:0;margin-bottom:20px}.glance-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px 18px;margin:16px 0}.glance-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:.86rem;color:#475569}.topics-cloud{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.topic-pill{display:inline-block;background:#eff6ff;color:#1e40af;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid #bfdbfe}.topic-pill.more{background:#f1f5f9;color:#64748b;border-color:#cbd5e1}.lesson-takeaways{background:#f8fafc;border-left:3px solid #2563eb;padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}.lesson-takeaways ul{margin:4px 0 0;padding-left:18px}.visuals-review-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}.visual-review-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s}.visual-review-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}.visual-review-img-wrap{position:relative;background:#0f172a;height:160px;display:grid;place-items:center;overflow:hidden}.visual-review-img-wrap img{max-width:100%;max-height:100%;object-fit:contain}.visual-review-label{padding:8px 12px;font-size:.82rem;font-weight:600;color:#1e293b;background:#fff;border-top:1px solid #e2e8f0}.btn-zoom-visual-review{position:absolute;bottom:6px;right:6px;background:rgba(15,23,42,.85);color:#fff;padding:3px 7px;border-radius:5px;font-size:.68rem;border:none;font-weight:600}.review-lightbox{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);display:flex;flex-direction:column}.review-lightbox-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;color:#fff;background:rgba(0,0,0,.4);border-bottom:1px solid rgba(255,255,255,.15)}.review-lightbox-actions{display:flex;align-items:center;gap:8px}.btn-lightbox-action{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.78rem}.btn-lightbox-action:hover{background:rgba(255,255,255,.25)}.review-lightbox-body{flex:1;overflow:auto;display:grid;place-items:center;padding:24px}.review-lightbox-img{max-width:90vw;max-height:80vh;object-fit:contain;border-radius:8px;transition:transform .15s ease-out}.reference-tabs-list{font-size:.85rem;color:#64748b;line-height:1.6;margin:8px 0}.reference-tabs-list li{margin:3px 0}table{width:100%;border-collapse:collapse;margin:14px 0 20px;font-size:.88rem}th,td{border:1px solid #cbd5e1;padding:9px 12px;text-align:left;vertical-align:top}th{background:#f1f5f9;font-weight:600;color:#0f172a}tr:nth-child(even) td{background:#f8fafc}.review-table{width:100%;border-collapse:collapse;margin:12px 0 22px;border-radius:8px;overflow:hidden;border:1px solid #cbd5e1;background:#fff}.review-table th{background:#f1f5f9;border:1px solid #cbd5e1;padding:9px 14px;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#334155}.review-table td{border:1px solid #e2e8f0;padding:9px 14px;font-size:.86rem;color:#1e293b;vertical-align:middle}.review-table tr:nth-child(even) td{background:#f8fafc}.review-table tr:hover td{background:#f1f5f9}pre,code{white-space:pre-wrap;overflow-wrap:anywhere}p,li{orphans:3;widows:3}@media print{.toolbar,.btn-zoom-visual-review,.review-lightbox{display:none!important}body{padding:0}table,tr,.review-table{break-inside:avoid}}
</style></head><body><div class="toolbar"><button id="print">Print / Save as PDF</button><span>Choose “Save as PDF” in your browser’s print dialog.</span></div><main id="review" role="main"><p>Loading session review…</p></main><script type="module" src="./printReview.ts"></script></body></html>
